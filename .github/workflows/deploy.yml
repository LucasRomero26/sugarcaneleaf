name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Frontend deploy is handled by Vercel Git integration (auto-trigger on push
# to main, Root Directory = frontend/). Re-running the CLI here collided with
# the configured Root Directory ("frontend/frontend" path not found). Backend
# deploy is via Render deploy hook + health-check warm-up.

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret not set"
            exit 1
          fi
          echo "Triggering Render deploy hook..."
          curl -fsSL "$RENDER_DEPLOY_HOOK_URL" \
            -o render-response.json -w "HTTP %{http_code}\n"
          echo "::notice::Render deploy triggered"

      - name: Wait for backend health (warm-up)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL secret not set — skipping health check"
            exit 0
          fi
          echo "Polling $BACKEND_URL/health ..."
          for i in $(seq 1 30); do
            if curl -sf "${BACKEND_URL}/health" > /dev/null 2>&1; then
              echo "Backend healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not become healthy in 5min"
          exit 1
