<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="author" content="Lucas Romero" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!--
      Per-route SEO tags (description, canonical, Open Graph, Twitter, JSON-LD)
      and the page title below are injected per page by scripts/prerender.mjs at
      build time, and kept in sync on client-side navigation by src/lib/head.ts.
    -->
    <!--seo-head-->
    <!--
      Inter is self-hosted (no render-blocking Google Fonts CSS). A single
      variable woff2, latin subset, 48KB, covers every weight the UI uses
      (400-900). Preloaded so it usually arrives before first paint; the
      metric-matched Arial fallback avoids layout shift if it doesn't.
    -->
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-latin-wght.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial');
        ascent-override: 90.49%;
        descent-override: 22.56%;
        line-gap-override: 0%;
        size-adjust: 107.06%;
      }
    </style>
    <title>Sugarcane Leaf Disease Detection In-Browser | SugarcaneLeaf</title>
    <!--
      Import map for @litertjs/core.
      @ultralytics/yolo loads LiteRT.js via an indirect dynamic import
      (`const pkg = '@litertjs/core'; await import(pkg)`) which Vite cannot
      statically resolve, so we hand it to the browser's import map instead.
      jsDelivr serves @litertjs/core with `cross-origin-resource-policy:
      cross-origin` and `access-control-allow-origin: *`, which makes it
      loadable under our cross-origin isolation (COOP/COEP) headers.
      Pin the version to match the one in package-lock.json (avoids drift).
    -->
    <script type="importmap">
      {
        "imports": {
          "@litertjs/core": "/litertjs-core.mjs",
          "@litertjs/wasm-utils": "/litertjs-wasm-utils.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
