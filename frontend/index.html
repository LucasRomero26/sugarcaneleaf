<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Foliar disease segmentation for sugarcane — YOLO26m-seg running in-browser via LiteRT.js + WebGPU. 91.7% mAP@0.5, 5 disease classes, zero server roundtrip." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Sugarcane Leaf Disease Detection</title>
    <!--
      Import map for @litertjs/core.
      @ultralytics/yolo loads LiteRT.js via an indirect dynamic import
      (`const pkg = '@litertjs/core'; await import(pkg)`) which Vite cannot
      statically resolve, so we hand it to the browser's import map instead.
      jsDelivr serves @litertjs/core with `cross-origin-resource-policy:
      cross-origin` and `access-control-allow-origin: *`, which makes it
      loadable under our cross-origin isolation (COOP/COEP) headers.
      Pin the version to match the one in package-lock.json (avoids drift).
    -->
    <script type="importmap">
      {
        "imports": {
          "@litertjs/core": "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
