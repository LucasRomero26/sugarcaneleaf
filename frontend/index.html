<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="author" content="Lucas Romero" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!--
      Per-route SEO tags (description, canonical, Open Graph, Twitter, JSON-LD)
      and the page title below are injected per page by scripts/prerender.mjs at
      build time, and kept in sync on client-side navigation by src/lib/head.ts.
    -->
    <!--seo-head-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Sugarcane Leaf Disease Detection In-Browser | SugarcaneLeaf</title>
    <!--
      Import map for @litertjs/core.
      @ultralytics/yolo loads LiteRT.js via an indirect dynamic import
      (`const pkg = '@litertjs/core'; await import(pkg)`) which Vite cannot
      statically resolve, so we hand it to the browser's import map instead.
      jsDelivr serves @litertjs/core with `cross-origin-resource-policy:
      cross-origin` and `access-control-allow-origin: *`, which makes it
      loadable under our cross-origin isolation (COOP/COEP) headers.
      Pin the version to match the one in package-lock.json (avoids drift).
    -->
    <script type="importmap">
      {
        "imports": {
          "@litertjs/core": "/litertjs-core.mjs",
          "@litertjs/wasm-utils": "/litertjs-wasm-utils.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
